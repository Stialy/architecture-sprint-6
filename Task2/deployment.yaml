apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaleapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaleapp
  template:
    metadata:
      labels:
        app: scaleapp
    spec:
      containers:
      - name: scaletestapp-container
        image: shestera/scaletestapp
        ports:
        - containerPort: 8080
        resources:
            limits:
              memory: "30Mi"